name: RFP visual refresh content history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfp-visual-history-once.yml'
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Configure package manager
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Recompute revised public content history
        run: node scripts/generate-content-history.mjs --write
      - name: Validate TypeScript
        run: pnpm typecheck
      - name: Commit 3 changed page histories
        run: |
          git config user.name "TruTool Content Bot"
          git config user.email "content-history@users.noreply.github.com"
          git add lib/content-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh hub and RFP comparison revision dates"
            git push origin HEAD:main
          fi
