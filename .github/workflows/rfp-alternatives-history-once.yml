name: RFP alternatives editorial history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfp-alternatives-history-once.yml'
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare pinned package manager
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record editorial page revisions
        run: node scripts/generate-content-history.mjs --write --date 2026-10-22T18:30:00Z
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Commit revision record
        run: |
          git config user.name "TruTool Content Bot"
          git config user.email "content-history@users.noreply.github.com"
          git add lib/content-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Date Loopio and Responsive editorial alternatives guides"
            git push origin HEAD:main
          fi
