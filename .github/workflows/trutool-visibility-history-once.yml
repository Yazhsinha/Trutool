name: Sync public visibility revisions once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trutool-visibility-history-once.yml'
permissions:
  contents: write
jobs:
  record-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate dated content history
        run: node scripts/generate-content-history.mjs --write --date 2026-10-22T12:00:00Z
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Commit revision history
        run: |
          git config user.name "TruTool Content Bot"
          git config user.email "content-history@users.noreply.github.com"
          git add lib/content-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TruTool content history after visibility cleanup"
            git push origin HEAD:main
          fi
