name: Featured alternatives revision history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/featured-alternatives-history-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record Alternatives hub revision
        run: node scripts/generate-content-history.mjs --write --date 2026-10-22T16:00:00Z
      - name: Validate types
        run: pnpm typecheck
      - name: Commit revision
        run: |
          git config user.name "TruTool Content Bot"
          git config user.email "content-history@users.noreply.github.com"
          git add lib/content-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Featured Alternatives hub revision"
            git push origin HEAD:main
          fi
